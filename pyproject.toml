[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-file-search-agent"
version = "0.1.0"
description = "CLI agent with local file search MCP and Microsoft Learn MCP integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
# Run the interactive CLI agent
file-search-agent = "src.agent.main:main"
# Run the standalone local MCP server
local-file-search-mcp = "src.mcp_local_file_search.server:run_server"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -v"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
